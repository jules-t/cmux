name: Validate DeepSeek Pi integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out trusted control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: control
          persist-credentials: false

      - name: Set up Node.js for Pi
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: control/personal/pi/package-lock.json

      - name: Install sandboxed Pi runner
        run: control/personal/ci/setup_pi.sh "$GITHUB_WORKSPACE/control"

      - name: Exercise DeepSeek through Pi
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          control/personal/ci/run_pi_agent.sh \
            --control "$GITHUB_WORKSPACE/control" \
            --workspace-root "$GITHUB_WORKSPACE/control" \
            --working-directory . \
            --prompt "$GITHUB_WORKSPACE/control/.github/pi/prompts/deepseek-smoke.txt" \
            --profile smoke \
            --output "$RUNNER_TEMP/deepseek-smoke-output.json"

      - name: Verify structured DeepSeek response
        run: |
          python3 control/personal/agent_output.py smoke \
            "$RUNNER_TEMP/deepseek-smoke-output.json"
