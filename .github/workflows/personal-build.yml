name: Build and publish cmux Personal

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Personal source branch or commit to build
        required: true
        default: personal/stable
        type: string
      expected_base_tag:
        description: Required official stable base tag; blank means auto-detect
        required: false
        default: ""
        type: string
      promote_source:
        description: Move personal/stable to the tested source after a successful build
        required: true
        default: false
        type: boolean
      publish_release:
        description: Publish an immutable personal release after a successful build
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: cmux-personal-stable-lifecycle
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      base_tag: ${{ steps.metadata.outputs.base_tag }}
      personal_tag: ${{ steps.naming.outputs.personal_tag }}
    steps:
      - name: Check out control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Check out requested source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source and stable base
        id: metadata
        working-directory: source
        env:
          EXPECTED_BASE_TAG: ${{ inputs.expected_base_tag }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          base_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD)"
          if [[ -n "$EXPECTED_BASE_TAG" && "$base_tag" != "$EXPECTED_BASE_TAG" ]]; then
            echo "source base $base_tag does not match required $EXPECTED_BASE_TAG" >&2
            exit 1
          fi
          git remote add upstream https://github.com/manaflow-ai/cmux.git
          git fetch --force upstream "refs/tags/${base_tag}:refs/tags/${base_tag}"
          git merge-base --is-ancestor "$base_tag" HEAD
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "base_tag=$base_tag" >> "$GITHUB_OUTPUT"

      - name: Allocate immutable release tag
        id: naming
        env:
          PYTHONPATH: ${{ github.workspace }}/control
        run: |
          python3 control/personal/release_naming.py \
            --repo source \
            --base-tag "${{ steps.metadata.outputs.base_tag }}" \
            --output "$RUNNER_TEMP/release-name.json"

  build:
    needs: metadata
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Check out exact personal source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          path: source
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Select Xcode 26
        working-directory: source
        env:
          CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
        run: ./scripts/select-ci-xcode.sh

      - name: Build, test, isolate, and package
        env:
          SWIFT_BACKTRACE: "interactive=no,timeout=0s,symbolicate=off,color=no"
        run: |
          set -euo pipefail
          control/personal/ci/build_personal.sh \
            source \
            control \
            "$RUNNER_TEMP/dist" \
            "$RUNNER_TEMP/derived-data" \
            "${{ needs.metadata.outputs.source_sha }}" \
            "${{ needs.metadata.outputs.base_tag }}" \
            "${{ needs.metadata.outputs.personal_tag }}"

      - name: Upload isolated build assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-personal-unattested-${{ needs.metadata.outputs.personal_tag }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 1

  attest:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out trusted control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Download isolated build assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-personal-unattested-${{ needs.metadata.outputs.personal_tag }}
          path: dist

      - name: Verify asset identity before attestation
        env:
          PYTHONPATH: ${{ github.workspace }}/control
        run: |
          python3 control/personal/verify_release_assets.py \
            --config control/personal/config.json \
            --directory dist \
            --source-sha "${{ needs.metadata.outputs.source_sha }}" \
            --base-tag "${{ needs.metadata.outputs.base_tag }}" \
            --personal-tag "${{ needs.metadata.outputs.personal_tag }}"

      - name: Attest personal app archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ github.workspace }}/dist/cmux-personal-macos-arm64.zip

      - name: Upload attested build assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-personal-${{ needs.metadata.outputs.personal_tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: ${{ inputs.publish_release }}
    needs: [metadata, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out trusted control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Check out current personal state
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: personal-control
          path: state

      - name: Download verified build assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-personal-${{ needs.metadata.outputs.personal_tag }}
          path: dist

      - name: Create verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PERSONAL_TAG: ${{ needs.metadata.outputs.personal_tag }}
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
          BASE_TAG: ${{ needs.metadata.outputs.base_tag }}
        run: |
          set -euo pipefail
          gh release create "$PERSONAL_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "cmux Personal ${PERSONAL_TAG}" \
            --notes "Personal arm64 build based on official cmux ${BASE_TAG}. Built and tested on the free GitHub-hosted macos-26 runner; the archive has GitHub build-provenance attestation." \
            --draft \
            dist/*

      - name: Promote tested source when requested
        if: ${{ inputs.promote_source }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/personal/stable" \
            -f sha="$SOURCE_SHA" \
            -F force=true

      - name: Make verified release visible to local updaters
        env:
          GH_TOKEN: ${{ github.token }}
          PERSONAL_TAG: ${{ needs.metadata.outputs.personal_tag }}
        run: |
          gh release edit "$PERSONAL_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

      - name: Record promoted state
        env:
          PYTHONPATH: ${{ github.workspace }}/control
        run: |
          set -euo pipefail
          python3 control/personal/state_manager.py promote \
            --state state/personal/state.json \
            --base-tag "${{ needs.metadata.outputs.base_tag }}" \
            --personal-tag "${{ needs.metadata.outputs.personal_tag }}" \
            --source-sha "${{ needs.metadata.outputs.source_sha }}" \
            --run-id "$GITHUB_RUN_ID"
          git -C state config user.name "cmux Personal automation"
          git -C state config user.email "actions@users.noreply.github.com"
          git -C state add personal/state.json
          if ! git -C state diff --cached --quiet; then
            git -C state commit -m "chore(personal): record ${{ needs.metadata.outputs.personal_tag }}"
            git -C state push origin personal-control
          fi

  report-failure:
    if: ${{ always() && (needs.metadata.result == 'failure' || needs.build.result == 'failure' || needs.attest.result == 'failure' || needs.publish.result == 'failure') }}
    needs: [metadata, build, attest, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Report stopped build
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/control
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 control/personal/report_issue.py \
            --repo "$GITHUB_REPOSITORY" \
            --assignee "${GITHUB_REPOSITORY_OWNER}" \
            --title "cmux Personal build requires attention" \
            --body "The personal build or publication gate stopped. No failed or unverified artifact was exposed to the local updater; a safe draft release may remain for inspection. Review: ${RUN_URL}"
