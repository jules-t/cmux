name: Build and publish cmux Personal

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Personal source branch or commit to build
        required: true
        default: personal/stable
        type: string
      expected_base_tag:
        description: Required official stable base tag; blank means auto-detect
        required: false
        default: ""
        type: string
      expected_upstream_main_sha:
        description: Exact verified upstream main base; blank selects stable runtime assets
        required: false
        default: ""
        type: string
      runtime_manifest_asset:
        description: Immutable upstream nightly runtime manifest for main-based builds
        required: false
        default: ""
        type: string
      promote_source:
        description: Move personal/stable to the tested source after a successful build
        required: true
        default: false
        type: boolean
      publish_release:
        description: Publish an immutable personal release after a successful build
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  attestations: read
  contents: read

concurrency:
  group: cmux-personal-stable-lifecycle
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js for Pi
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: personal/pi/package-lock.json

      - name: Run static and semantic control-plane checks
        run: personal/ci/check_control_plane.sh "$GITHUB_WORKSPACE"

  metadata:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    outputs:
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      base_tag: ${{ steps.metadata.outputs.base_tag }}
      upstream_main_sha: ${{ steps.metadata.outputs.upstream_main_sha }}
      personal_tag: ${{ steps.naming.outputs.personal_tag }}
    steps:
      - name: Check out control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Check out requested source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 1
          fetch-tags: false
          filter: blob:none
          persist-credentials: false

      - name: Fetch requested source history
        run: control/personal/ci/fetch_target_history.sh "$GITHUB_WORKSPACE/source"

      - name: Validate source and stable base
        id: metadata
        working-directory: source
        env:
          EXPECTED_BASE_TAG: ${{ inputs.expected_base_tag }}
          EXPECTED_UPSTREAM_MAIN_SHA: ${{ inputs.expected_upstream_main_sha }}
          RUNTIME_MANIFEST_ASSET: ${{ inputs.runtime_manifest_asset }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          git remote add upstream https://github.com/manaflow-ai/cmux.git
          git fetch --filter=blob:none --no-tags --force upstream \
            '+refs/tags/v*:refs/tags/v*'
          base_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD)"
          if [[ -n "$EXPECTED_BASE_TAG" && "$base_tag" != "$EXPECTED_BASE_TAG" ]]; then
            echo "source base $base_tag does not match required $EXPECTED_BASE_TAG" >&2
            exit 1
          fi
          git fetch --force upstream "refs/tags/${base_tag}:refs/tags/${base_tag}"
          git merge-base --is-ancestor "$base_tag" HEAD
          if [[ -n "$EXPECTED_UPSTREAM_MAIN_SHA" || -n "$RUNTIME_MANIFEST_ASSET" ]]; then
            if [[ ! "$EXPECTED_UPSTREAM_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "main-based builds require an exact upstream main SHA" >&2
              exit 1
            fi
            if [[ ! "$RUNTIME_MANIFEST_ASSET" =~ ^cmuxd-remote-manifest-[1-9][0-9]+\.json$ ]]; then
              echo "main-based builds require an immutable nightly runtime manifest" >&2
              exit 1
            fi
            git fetch --force upstream "$EXPECTED_UPSTREAM_MAIN_SHA"
            git merge-base --is-ancestor "$base_tag" "$EXPECTED_UPSTREAM_MAIN_SHA"
            git merge-base --is-ancestor "$EXPECTED_UPSTREAM_MAIN_SHA" HEAD
            if ! git diff --quiet "$EXPECTED_UPSTREAM_MAIN_SHA" HEAD -- daemon/remote; then
              echo "personal daemon changes cannot reuse the verified upstream-main runtime assets" >&2
              exit 1
            fi
          else
            if ! git diff --quiet "$base_tag" HEAD -- daemon/remote; then
              echo "personal daemon changes cannot reuse official ${base_tag} runtime assets" >&2
              exit 1
            fi
          fi
          {
            echo "source_sha=$source_sha"
            echo "base_tag=$base_tag"
            echo "upstream_main_sha=$EXPECTED_UPSTREAM_MAIN_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Allocate immutable release tag
        id: naming
        env:
          PYTHONPATH: ${{ github.workspace }}/control
        run: |
          python3 control/personal/release_naming.py \
            --repo source \
            --base-tag "${{ steps.metadata.outputs.base_tag }}" \
            --output "$RUNNER_TEMP/release-name.json"

      - name: Fetch and verify official remote runtime manifest
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_TAG: ${{ steps.metadata.outputs.base_tag }}
          UPSTREAM_MAIN_SHA: ${{ steps.metadata.outputs.upstream_main_sha }}
          RUNTIME_MANIFEST_ASSET: ${{ inputs.runtime_manifest_asset }}
          UPSTREAM_REPOSITORY: manaflow-ai/cmux
          PYTHONPATH: ${{ github.workspace }}/control
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/official-runtime"
          mkdir -p "$runtime_dir"
          if [[ -n "$UPSTREAM_MAIN_SHA" ]]; then
            runtime_build="${RUNTIME_MANIFEST_ASSET#cmuxd-remote-manifest-}"
            runtime_build="${runtime_build%.json}"
            gh release download nightly \
              --repo "$UPSTREAM_REPOSITORY" \
              --pattern "$RUNTIME_MANIFEST_ASSET" \
              --dir "$runtime_dir"
            gh attestation verify "$runtime_dir/$RUNTIME_MANIFEST_ASSET" \
              --repo "$UPSTREAM_REPOSITORY" \
              --signer-workflow "$UPSTREAM_REPOSITORY/.github/workflows/nightly.yml" \
              --signer-digest "$UPSTREAM_MAIN_SHA" \
              --source-ref refs/heads/main \
              --source-digest "$UPSTREAM_MAIN_SHA"
            python3 control/personal/official_runtime_manifest.py \
              --manifest "$runtime_dir/$RUNTIME_MANIFEST_ASSET" \
              --repository "$UPSTREAM_REPOSITORY" \
              --base-tag "$BASE_TAG" \
              --channel nightly \
              --runtime-build "$runtime_build"
            cp "$runtime_dir/$RUNTIME_MANIFEST_ASSET" \
              "$runtime_dir/cmuxd-remote-manifest.json"
          else
            gh release download "$BASE_TAG" \
              --repo "$UPSTREAM_REPOSITORY" \
              --pattern cmuxd-remote-manifest.json \
              --dir "$runtime_dir"
            source_digest="$(git -C source rev-parse "${BASE_TAG}^{commit}")"
            gh attestation verify "$runtime_dir/cmuxd-remote-manifest.json" \
              --repo "$UPSTREAM_REPOSITORY" \
              --signer-workflow "$UPSTREAM_REPOSITORY/.github/workflows/release.yml" \
              --signer-digest "$source_digest" \
              --source-ref "refs/tags/${BASE_TAG}" \
              --source-digest "$source_digest"
            python3 control/personal/official_runtime_manifest.py \
              --manifest "$runtime_dir/cmuxd-remote-manifest.json" \
              --repository "$UPSTREAM_REPOSITORY" \
              --base-tag "$BASE_TAG" \
              --channel stable
          fi

      - name: Upload verified official runtime manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-official-runtime-${{ steps.naming.outputs.personal_tag }}
          path: ${{ runner.temp }}/official-runtime/cmuxd-remote-manifest.json
          if-no-files-found: error
          retention-days: 1

  preflight:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out trusted control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Reserve exact draft and verify publication permission
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_FORK_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/control
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "PERSONAL_FORK_TOKEN is required for publication" >&2
            exit 1
          fi
          python3 control/personal/release_publisher.py reserve \
            --repo "$GITHUB_REPOSITORY" \
            --personal-tag "${{ needs.metadata.outputs.personal_tag }}" \
            --source-sha "${{ needs.metadata.outputs.source_sha }}" \
            --base-tag "${{ needs.metadata.outputs.base_tag }}" \
            --run-url "$RUN_URL"

      - name: Rehearse publication against a disposable release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_FORK_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/control
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "PERSONAL_FORK_TOKEN is required for the publication rehearsal" >&2
            exit 1
          fi
          python3 control/personal/release_publisher.py rehearse \
            --repo "$GITHUB_REPOSITORY" \
            --config control/personal/config.json \
            --target-sha "$TARGET_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$RUN_URL"

  ghostty_helper:
    needs: [metadata, preflight]
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact personal source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          path: source
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Build real arm64 Ghostty CLI helper on macOS 15
        working-directory: source
        run: |
          set -euo pipefail
          ./scripts/install-zig-ci.sh
          mkdir -p "$RUNNER_TEMP/ghostty-helper"
          ./scripts/build-ghostty-cli-helper.sh \
            --target aarch64-macos \
            --output "$RUNNER_TEMP/ghostty-helper/ghostty"
          lipo "$RUNNER_TEMP/ghostty-helper/ghostty" -verify_arch arm64

      - name: Upload real Ghostty CLI helper
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-personal-ghostty-helper-${{ needs.metadata.outputs.personal_tag }}
          path: ${{ runner.temp }}/ghostty-helper/ghostty
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [metadata, ghostty_helper]
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Check out exact personal source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          path: source
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Select Xcode 26
        working-directory: source
        env:
          CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
        run: ./scripts/select-ci-xcode.sh

      - name: Download real Ghostty CLI helper
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-personal-ghostty-helper-${{ needs.metadata.outputs.personal_tag }}
          path: ghostty-helper

      - name: Download verified official runtime manifest
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-official-runtime-${{ needs.metadata.outputs.personal_tag }}
          path: official-runtime

      - name: Build, test, isolate, and package
        env:
          SWIFT_BACKTRACE: "interactive=no,timeout=0s,symbolicate=off,color=no"
        run: |
          set -euo pipefail
          control/personal/ci/build_personal.sh \
            source \
            control \
            "$RUNNER_TEMP/dist" \
            "$RUNNER_TEMP/derived-data" \
            "${{ needs.metadata.outputs.source_sha }}" \
            "${{ needs.metadata.outputs.base_tag }}" \
            "${{ needs.metadata.outputs.personal_tag }}" \
            "$GITHUB_WORKSPACE/ghostty-helper/ghostty" \
            "$GITHUB_WORKSPACE/official-runtime/cmuxd-remote-manifest.json" \
            "${{ needs.metadata.outputs.upstream_main_sha }}"

      - name: Upload isolated build assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-personal-unattested-${{ needs.metadata.outputs.personal_tag }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 1

  attest:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out trusted control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Download isolated build assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-personal-unattested-${{ needs.metadata.outputs.personal_tag }}
          path: dist

      - name: Verify asset identity before attestation
        env:
          PYTHONPATH: ${{ github.workspace }}/control
        run: |
          python3 control/personal/verify_release_assets.py \
            --config control/personal/config.json \
            --directory dist \
            --source-sha "${{ needs.metadata.outputs.source_sha }}" \
            --base-tag "${{ needs.metadata.outputs.base_tag }}" \
            --personal-tag "${{ needs.metadata.outputs.personal_tag }}" \
            --upstream-main-sha "${{ needs.metadata.outputs.upstream_main_sha }}"

      - name: Attest personal app archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ github.workspace }}/dist/cmux-personal-macos-arm64.zip

      - name: Upload attested build assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-personal-${{ needs.metadata.outputs.personal_tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ inputs.publish_release }}
    needs: [metadata, preflight, attest]
    uses: ./.github/workflows/personal-publish.yml
    with:
      build_run_id: ${{ github.run_id }}
      promote_source: ${{ inputs.promote_source }}
    secrets:
      PERSONAL_FORK_TOKEN: ${{ secrets.PERSONAL_FORK_TOKEN }}

  report-failure:
    if: ${{ always() && (needs.validate.result == 'failure' || needs.validate.result == 'cancelled' || needs.metadata.result == 'failure' || needs.metadata.result == 'cancelled' || needs.preflight.result == 'failure' || needs.preflight.result == 'cancelled' || needs.ghostty_helper.result == 'failure' || needs.ghostty_helper.result == 'cancelled' || needs.build.result == 'failure' || needs.build.result == 'cancelled' || needs.attest.result == 'failure' || needs.attest.result == 'cancelled' || needs.publish.result == 'failure' || needs.publish.result == 'cancelled') }}
    needs: [validate, metadata, preflight, ghostty_helper, build, attest, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Report stopped build
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/control
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 control/personal/report_issue.py \
            --repo "$GITHUB_REPOSITORY" \
            --assignee "${GITHUB_REPOSITORY_OWNER}" \
            --title "cmux Personal build requires attention" \
            --body "The personal build or publication gate stopped. No failed or unverified artifact was exposed to the local updater; a safe draft release may remain for inspection. Review: ${RUN_URL}"
