name: Validate cmux Personal control plane

on:
  push:
    branches:
      - personal-control
    paths:
      - ".github/workflows/**"
      - "personal/**"
  pull_request:
    branches:
      - personal-control
    paths:
      - ".github/workflows/**"
      - "personal/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmux-personal-control-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js for Pi
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: personal/pi/package-lock.json

      - name: Run static and semantic control-plane checks
        run: personal/ci/check_control_plane.sh "$GITHUB_WORKSPACE"
